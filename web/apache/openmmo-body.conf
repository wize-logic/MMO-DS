# Shared by the plain and the TLS virtual host, so the two cannot drift apart.
# Installed as /etc/apache2/openmmo-body.conf; not a conf-available file, because
# it only makes sense inside a <VirtualHost>.

DocumentRoot /var/www/openmmo

<Directory /var/www/openmmo>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Registration and the status panel are the only dynamic parts. server.web listens
# on loopback and is reached no other way.
ProxyPreserveHost On
ProxyPass /api/ http://127.0.0.1:8088/api/ retry=0 timeout=10
ProxyPassReverse /api/ http://127.0.0.1:8088/api/
<Location /api/>
    Require all granted
</Location>

ErrorDocument 404 /404.html

# The site is one origin with no third party anything. Nothing needs to be
# loosened here unless a page starts loading something from elsewhere.
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
Header always set X-Frame-Options "DENY"
# Cloudflare serves this site over https, so promising https here is honest.
Header always set Strict-Transport-Security "max-age=15768000"

<FilesMatch "\.(css|js|png|svg|ico)$">
    Header set Cache-Control "public, max-age=3600"
</FilesMatch>
<FilesMatch "\.html$">
    Header set Cache-Control "no-cache"
</FilesMatch>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json
</IfModule>
