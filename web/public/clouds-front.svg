<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="150" viewBox="0 0 1300 150">
<!-- The near cloud band: the biggest, brightest and fastest of the three, so it
     is the one that reads as parallax, and the one whose edges matter most at
     11px a second. See clouds-back.svg. -->
<defs>
<filter id="soft" color-interpolation-filters="sRGB">
<feGaussianBlur stdDeviation="0.9"/>
</filter>
<g id="c" fill="#fff">
<rect x="30" y="-24" width="180" height="24"/>
<circle cx="34" cy="-16" r="16"/>
<circle cx="52" cy="-34" r="30"/>
<circle cx="100" cy="-52" r="42"/>
<circle cx="126" cy="-62" r="26"/>
<circle cx="150" cy="-40" r="34"/>
<circle cx="188" cy="-24" r="22"/>
<circle cx="204" cy="-14" r="14"/>
</g>
</defs>
<g filter="url(#soft)">
<use href="#c" transform="translate(70 128) scale(0.85)" opacity="0.50"/>
<use href="#c" transform="translate(380 140) scale(0.70)" opacity="0.42"/>
<use href="#c" transform="translate(640 120) scale(1)" opacity="0.52"/>
<use href="#c" transform="translate(980 138) scale(0.78)" opacity="0.45"/>
</g>
</svg>
