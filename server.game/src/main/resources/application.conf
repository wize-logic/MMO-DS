server {
  # Which local interface to bind. "0.0.0.0" is every one of them.
  host = "0.0.0.0"
  host = ${?GAME_HOST}
  port = 7777
  # The same variable the login server advertises to clients, so the port a
  # client is told to dial and the port this server binds cannot drift apart.
  # It was -Dserver.port or nothing before, which is why start-server.sh passes
  # a JAVA_OPTS the other two servers do not need.
  port = ${?GAME_SERVER_PORT}
  # The online-count endpoint for the website. Loopback: server.web is its one caller.
  statusHost = "127.0.0.1"
  statusHost = ${?GAME_STATUS_HOST}
  statusPort = 7779
  statusPort = ${?GAME_STATUS_PORT}
  # A keyed frame tag, the same profile the login server has always used. CRC-16 sat here for a
  # long time and it is an error detector, not an integrity check: it takes no key, so anyone who
  # can change a byte on the wire can repair it, and the cipher under it is AES-CTR, where flipping
  # a ciphertext bit flips exactly that plaintext bit. Between the two, a frame in flight could be
  # edited into a different one. HMAC-SHA256 also mixes a per-direction round counter, which binds
  # a frame to its place in the stream. Both ends have implemented every size in 4..32 from the
  # start (ChecksumFactory, mmo/src/checksum.c) and the client adopts whatever ServerHello names,
  # so this is a profile change and not a protocol one.
  checksumSize = 16
  rootKeyResource = "game.private.pem"
  rootKey = ${?OPENMMO_GAME_PRIVATE_KEY}
  rootKeyFile = ${?OPENMMO_GAME_PRIVATE_KEY_FILE}
  sessionSecret = "dev-only-secret-do-not-use-in-production"
  sessionSecret = ${?OPENMMO_SESSION_SECRET}
  sessionTokenMaxAge = 5m
  sessionTokenMaxAge = ${?OPENMMO_SESSION_TOKEN_MAX_AGE}
}

db {
  host = "localhost"
  host = ${?GAME_DB_HOST}
  port = 20021
  port = ${?GAME_DB_PORT}
  name = "openmmo_game_db"
  name = ${?GAME_DB_NAME}
  user = "openmmo_game_user"
  user = ${?GAME_DB_USER}
  password = "changeMe!"
  password = ${?GAME_DB_PASSWORD}
  poolSize = 4
  poolSize = ${?GAME_DB_POOL_SIZE}
  # Applies db/dev, which now only clears out what older checkouts seeded. It creates nothing.
  seedDev = false
  seedDev = ${?GAME_DB_SEED_DEV}
}
